openapi: 3.0.0

info:
  title: API Management System
  version: 1.0.0
  description: Scalable Node.js API Management Backend

servers:
  - url: http://localhost:5000

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

paths:

  /api/v1/auth/register:
    post:
      summary: Register User
      tags:
        - Authentication

      requestBody:
        required: true

        content:
          application/json:
            schema:
              type: object

              properties:
                name:
                  type: string

                email:
                  type: string

                password:
                  type: string

      responses:
        201:
          description: User registered successfully

  /api/v1/auth/login:
    post:
      summary: Login User
      tags:
        - Authentication

      requestBody:
        required: true

        content:
          application/json:
            schema:
              type: object

              properties:
                email:
                  type: string

                password:
                  type: string

      responses:
        200:
          description: Login successful


  /api/v1/orders:

    post:
      summary: Create Order
      tags:
        - Orders

      security:
        - bearerAuth: []

      requestBody:
        required: true

        content:
          application/json:
            schema:
              type: object

              properties:
                productName:
                  type: string

                quantity:
                  type: integer

                price:
                  type: number

      responses:
        201:
          description: Order created successfully

    get:
      summary: Get All Orders
      tags:
        - Orders

      security:
        - bearerAuth: []

      responses:
        200:
          description: Orders fetched successfully